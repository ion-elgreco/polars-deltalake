[package]
name = "polars-deltalake"
version = "0.0.0-dev"
edition = "2024"
authors = ["Ion Koutsouris <ion@orchestration.rs>"]
description = "Native Polars I/O plugin for Delta Lake, backed by delta-kernel-rs with a polars-io engine."
license = "Apache-2.0"
repository = "https://github.com/ion-elgreco/polars-deltalake"

[lib]
name = "polars_deltalake"
crate-type = ["cdylib"]

[dependencies]
# Kernel — protocol only; we provide our own Engine implementation backed by
# polars-io, so the default-engine feature is intentionally NOT enabled.
# Pinned to a main-branch rev for the declarative-plans execution path
# (PlanExecutor + Scan::declarative_metadata_scan_plan), which is not in a
# tagged release yet. `vendored-protoc` supplies the protoc binary the
# declarative-plans proto codegen runs at build time.
delta_kernel = { git = "https://github.com/delta-io/delta-kernel-rs", rev = "64fe8e992695a0ea5141642484ff45cbe24d06e4", default-features = false, features = [
    "internal-api",
    "declarative-plans",
    "vendored-protoc",
] }

# Polars — parquet + ndjson readers, plus the lazy DSL for the expression
# translator. `polars-arrow` exposes the ArrowSchema/Field/StructArray types
# the parquet reader projects against.
polars = { version = "0.55", default-features = false, features = [
    "parquet",
    "json",
    "lazy",
    "async",
    "streaming",
    "fmt",
    "diagonal_concat",
    "partition_by",
    # Cloud backends for object_store-backed scans.
    "cloud",
    "aws",
    "azure",
    "gcp",
    "http",
    # Dtypes Delta surfaces.
    "dtype-i8",
    "dtype-i16",
    "dtype-decimal",
    "dtype-struct",
    "dtype-date",
    "dtype-datetime",
    # Kernel IntervalDayTime maps onto Duration(µs).
    "dtype-duration",
    "timezones",
    # Polars-ops compile-required.
    "dtype-u8",
    "dtype-u16",
    "dtype-i128",
    "dtype-u128",
    "object",
    # Full DSL surface for predicate round-tripping (kernel doesn't surface
    # most of these, but a user predicate's Expr serialization may reference
    # them and we want the deserialize to succeed so pushdown / kernel
    # file-skipping work everywhere they can).
    "temporal",
    "bitwise",
    "strings",
    "regex",
    "is_in",
    "is_between",
    "is_close",
    "is_first_distinct",
    "is_last_distinct",
    "abs",
    "log",
    "trigonometry",
    "round_series",
    "sign",
    "mode",
    "moment",
    "true_div",
    "checked_arithmetic",
    "rle",
    "hist",
    "pct_change",
    "rank",
    "replace",
    "row_hash",
    "search_sorted",
    "approx_unique",
    "list_eval",
    "list_drop_nulls",
    "list_count",
    "list_sets",
    "list_gather",
    "list_sample",
    "array_count",
    "binary_encoding",
    "extract_jsonpath",
    "extract_groups",
    "find_many",
    "peaks",
    "interpolate",
    "interpolate_by",
    "ewma",
    "ewma_by",
    "diff",
    "cum_agg",
    "cutqcut",
    "asof_join",
    "cross_join",
    "iejoin",
    "semi_anti_join",
    "merge_sorted",
    "top_k",
    "repeat_by",
    "concat_str",
    "string_pad",
    "string_normalize",
    "string_reverse",
    "string_to_integer",
] }
polars-arrow = { version = "0.55", default-features = false }
polars-utils = { version = "0.55", default-features = false }
# polars-parquet — for `deserialize_metadata` + `PARQUET_MAGIC` /
# `FOOTER_SIZE` constants, used by the suffix-range footer reader to avoid
# downloading the whole file for kernel's `read_parquet_footer`.
polars-parquet = { version = "0.55", default-features = false }
# polars-buffer — `deserialize_metadata` takes its `Buffer<u8>` since 0.55.
polars-buffer = { version = "0.55", default-features = false }
polars-ffi = { version = "0.55" }
# polars-plan exposes Expr / Operator / FunctionExpr / BooleanFunction /
# DynLiteralValue for the polars→kernel predicate pushdown translator.
# Feature set must broadly match what the Python polars wheel exposes so the
# serialized-Expr bytes we receive from pl.Expr.deserialize have all variant
# discriminants in range.
polars-plan = { version = "0.55", default-features = false, features = [
    "is_in",
    "is_between",
    "strings",
    "regex",
    "list_drop_nulls",
    "extract_jsonpath",
    "extract_groups",
    "round_series",
    "abs",
    "log",
    "trigonometry",
] }

# Object store — for the StorageHandler. Kernel 0.23 pairs with object_store
# 0.13 (via its `arrow-58` feature); we pin the same major so any future
# kernel-side helpers we touch don't drift. Cloud backends are opt-in via
# features, so deltas on local disk work out of the box and S3/Azure/GCS
# users enable what they need at build time.
object_store = { version = "0.13", features = ["aws", "azure", "gcp", "http"] }

# Tokio runtime for driving object_store from the kernel's sync handler API.
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
# Futures helpers used while collecting object_store streams in list_from.
futures-util = { version = "0.3", default-features = false }
# reqwest — used by the StorageHandler to fetch presigned URLs (Databricks /
# R2 / SigV4 query-string-auth) directly, bypassing object_store. Pinned to
# the version already in the workspace via polars-io's cloud deps.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# PyO3 boundary — polars-native types crossing into Python.
# pyo3 pinned to 0.29 to match pyo3-polars 0.28 (the latest release).
# `extension-module` lives behind a default cargo feature: wheel builds keep
# it, while `cargo test --no-default-features` links libpython so test
# binaries resolve the pyo3 symbols that polars-utils' numpy glue pulls in.
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-polars = { version = "0.28", features = [
    "lazy",
    "dtype-decimal",   # Delta `decimal(p, s)` → polars Decimal across FFI
    "dtype-struct",    # Delta `struct<…>` + our Map = List<Struct<key,value>>
] }

anyhow = "1"
bytes = "1"
url = "2"
tracing = "0.1"
rayon = "1"
# JSON-deserialize the polars `Expr` we receive from Python instead of going
# through pyo3-polars's bincode `PyExpr::extract`. Bincode encodes enum
# variants by position; the Python wheel's polars-rs is built with the full
# feature set and ours with a subset, so `#[cfg]`-gated `FunctionExpr`
# variants shift discriminants and the round-trip miscompiles silently. The
# JSON form is variant-name keyed and survives feature mismatches.
serde_json = "1"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"

# Release-quality optimisation + frame pointers + symbols so samply can
# attribute time correctly. Selected via `PROFILE=profiling just develop`.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

# CI profile — fast cold-start builds with cache-friendly artifacts.
# Inherits dev so our crate compiles cheaply, but disables incremental
# so sccache (which silently no-ops with CARGO_INCREMENTAL=1) can actually
# populate the cache. Dependencies are built at opt-level=3 with debuginfo
# stripped so the cached `target/` blob stays small and tests run at
# near-release speed. Selected via `PROFILE=ci` in CI.
[profile.ci]
inherits = "dev"
debug = false
incremental = false

[profile.ci.package."*"]
opt-level = 3
debug = false
debug-assertions = false
strip = "debuginfo"
