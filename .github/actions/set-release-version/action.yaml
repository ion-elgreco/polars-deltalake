name: "Set release version"
description: |
  Rewrite placeholder versions across the repo to the release version.
  Single source of truth for which files carry a version pin. The tree
  is mutated in place on the ephemeral build checkout — release workflows
  build artifacts from the rewritten state and never commit it back.

inputs:
  version:
    description: 'Release version without leading "v" (e.g. "0.1.1")'
    required: true

runs:
  using: "composite"
  steps:
    # TOML output in yq's encoder is only reliable from v4.50+. Runner-image
    # yq can lag, so pin here for determinism.
    - name: Install yq (pinned)
      id: yq
      shell: bash
      env:
        YQ_VERSION: v4.53.2
      run: |
        set -euo pipefail
        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64)     asset=yq_linux_amd64 ;;
          Linux/ARM64)   asset=yq_linux_arm64 ;;
          macOS/X64)     asset=yq_darwin_amd64 ;;
          macOS/ARM64)   asset=yq_darwin_arm64 ;;
          Windows/X64)   asset=yq_windows_amd64.exe ;;
          *) echo "unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        mkdir -p "$RUNNER_TEMP/yq-bin"
        target="$RUNNER_TEMP/yq-bin/yq"
        [ "$RUNNER_OS" = "Windows" ] && target="${target}.exe"
        curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/${asset}" -o "$target"
        chmod +x "$target"
        echo "bin=$target" >> "$GITHUB_OUTPUT"

    - name: Rewrite version pin
      shell: bash
      env:
        TAG: ${{ inputs.version }}
        YQ: ${{ steps.yq.outputs.bin }}
      run: |
        set -euo pipefail
        # pyproject.toml takes its version dynamically from Cargo.toml via
        # maturin, so we only have to pin one file.
        "$YQ" -i -p toml -o toml '.package.version = strenv(TAG)' python/Cargo.toml
